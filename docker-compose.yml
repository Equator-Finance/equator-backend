version: '3.8'

services:
  # Backend API & WebSocket Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equator-backend-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://equator:equatorpass@postgres:5432/equator_db?schema=public
      - REDIS_URL=redis://redis:6379
      - SOROBAN_RPC_URL=https://soroban-testnet.stellar.org
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: equator-postgres
    environment:
      POSTGRES_USER: equator
      POSTGRES_PASSWORD: equatorpass
      POSTGRES_DB: equator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis for WebSockets & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: equator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
